name: Offline research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[validation,research,demo]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_v2_exports.py
      - run: python scripts/check_planner_audit.py

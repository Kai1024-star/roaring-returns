<div id="journey">
  <div class="intro"><span class="tag">INVESTING, SEPARATED FROM DEPOSITS</span><strong id="value"></strong></div>
  <div class="views" role="group" aria-label="Chart measure"><button data-view="pnl" aria-pressed="true">Investment P&amp;L</button><button data-view="nav" aria-pressed="false">Investment return</button><button data-view="balance" aria-pressed="false">Account balance</button></div>
  <svg id="plot" viewBox="0 0 800 315" role="img" aria-label="Investment performance and drawdown"><title>Investment performance with deposits separated</title></svg>
  <div class="legend"><span id="series-label">● Net investment P&amp;L</span><span id="reference-label">◌ Cash reference P&amp;L</span><span class="risk-key">▰ Return drawdown below</span></div>
  <div class="controls"><button id="play" type="button">Replay journey</button><button id="reset" type="button">Reset</button><label for="time"><span id="unit">Month</span> <span id="month"></span></label><input id="time" type="range" min="0" aria-label="Illustration month"></div>
  <div id="ledger"></div><div id="allocations" aria-label="Illustrative asset holdings at this step"></div>
  <p id="explain"></p>
</div>
<style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:#172739;background:transparent}
#journey{padding:20px;background:#fff;border:1px solid #dfe5eb;border-radius:16px}.intro{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:10px;letter-spacing:1.2px;color:#64758a}#value{font-size:25px;white-space:nowrap}.views{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.views button{color:#526475;background:#f0f3f5;font-size:11px;padding:7px 11px}.views button[aria-pressed=true]{color:#fff;background:#173d4a}
#plot{display:block;width:100%;height:auto;max-height:315px;margin-top:12px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:#168a94;margin:8px 0 15px}#reference-label{color:#8797a9}.risk-key{color:#b66556}
button{border:0;border-radius:7px;padding:8px 12px;background:#173d4a;color:#fff;font:inherit;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#reset{background:#edf2f4;color:#34485d}button:focus-visible,input:focus-visible{outline:3px solid #bd963f;outline-offset:3px}input{accent-color:#168a94;min-width:130px;flex:1}label{font-size:11px}button:disabled{opacity:.6;cursor:default}
#ledger,#allocations{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}#ledger{padding:12px;background:#f6f8fa;border-radius:9px}.asset{font-size:10px;color:#68788a}.amount{display:block;margin-top:3px;font-size:14px;font-weight:600}.rail{height:3px;background:#edf1f4;margin-top:5px;overflow:hidden}.fill{height:100%}p{font-size:10px;line-height:1.6;color:#68788a;margin:14px 0 0}@media(max-width:500px){#journey{padding:12px}.tag{max-width:150px}#ledger,#allocations{grid-template-columns:repeat(2,1fr)}#value{font-size:20px}.legend{gap:8px}}
</style>
<script>
(()=>{
const d=__DATA__,root=document.getElementById('journey'),svg=root.querySelector('#plot'),slider=root.querySelector('#time'),button=root.querySelector('#play');
const money=x=>{if(Math.abs(x)<.005)x=0;let digits=Math.abs(x)<100?2:0;return (x<0?'−':'')+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:digits,maximumFractionDigits:digits}).format(Math.abs(x))};
const colors=['#9aa8b5','#168a94','#bd963f','#526b94'],names=['Cash','US stocks','Gold','7–10y Treasury fund'];
let t=d.values.length-1,view='pnl',playing=false,timer=null;const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const unit=d.unit||'Month',delay=unit==='Session'?45:240;slider.max=t;slider.value=t;slider.setAttribute('aria-label','Illustration '+unit.toLowerCase());root.querySelector('#unit').textContent=unit;
const pnl=d.values.map((v,i)=>v-d.deposits[i]),refPnl=d.referenceValues.map((v,i)=>v-d.deposits[i]);
const dd=d.drawdowns.map(v=>v===null?null:-100*v);
const x=i=>66+i/Math.max(1,d.values.length-1)*710;
function path(values,end,y){let open=false;return values.slice(0,end+1).map((v,i)=>{if(v===null){open=false;return ''}let cmd=(open?'L':'M')+x(i).toFixed(2)+','+y(v).toFixed(2);open=true;return cmd}).join(' ')}
function draw(){
const values=view==='pnl'?pnl:view==='nav'?d.nav.map(v=>v===null?null:100*(v-1)):d.values;
const reference=view==='pnl'?refPnl:view==='nav'?d.referenceNav.map(v=>v===null?null:100*(v-1)):d.deposits;
let all=values.concat(reference).filter(v=>v!==null);let low=Math.min(0,...all),high=Math.max(0,...all);if(high-low<1e-9){low=-1;high=1}let pad=(high-low)*.12;low-=view==='balance'?0:pad;high+=pad;
const y=v=>185-(v-low)/(high-low)*155,format=v=>view==='nav'?v.toFixed(1)+'%':money(v);let s='';
for(let i=0;i<4;i++){let v=low+(high-low)*i/3;s+='<line x1="66" y1="'+y(v)+'" x2="776" y2="'+y(v)+'" stroke="#edf0f3"/><text x="59" y="'+(y(v)+4)+'" text-anchor="end" fill="#68788a" font-size="10">'+format(v)+'</text>'}
s+='<line x1="66" y1="'+y(0)+'" x2="776" y2="'+y(0)+'" stroke="#aeb9c4" stroke-dasharray="3 4"/>';
s+='<path d="'+path(reference,t,y)+'" fill="none" stroke="#8797a9" stroke-width="1.8" stroke-dasharray="5 4"/>';
s+='<path d="'+path(values,t,y)+'" fill="none" stroke="#168a94" stroke-width="2.8" stroke-linejoin="round"/>';
if(values[t]!==null)s+='<circle cx="'+x(t)+'" cy="'+y(values[t])+'" r="4" fill="#168a94"/>';
let minDD=Math.min(-1,...dd.filter(v=>v!==null))*1.12,yd=v=>230+v/minDD*48;
s+='<text x="66" y="218" fill="#b66556" font-size="10">Return drawdown · deposits excluded</text><line x1="66" y1="230" x2="776" y2="230" stroke="#e4d5d1"/>';
s+='<path d="'+path(dd,t,yd)+'" fill="none" stroke="#b66556" stroke-width="2"/><text x="59" y="233" text-anchor="end" fill="#8a6b64" font-size="10">0%</text><text x="59" y="281" text-anchor="end" fill="#8a6b64" font-size="10">'+minDD.toFixed(1)+'%</text>';
s+='<text x="66" y="307" font-size="10" fill="#68788a">'+unit+' 0</text><text x="776" y="307" text-anchor="end" font-size="10" fill="#68788a">'+unit+' '+(d.values.length-1)+'</text>';svg.innerHTML='<title>Investment performance and flow-neutral drawdown</title>'+s;
root.querySelector('#value').textContent=values[t]===null?'Not yet funded':format(values[t]);root.querySelector('#month').textContent=t+(d.dates?' · '+d.dates[t]:'');slider.value=t;
root.querySelector('#series-label').textContent='● '+(view==='pnl'?'Net investment P&L':view==='nav'?'Return excluding deposits':'Account balance');root.querySelector('#reference-label').textContent=view==='balance'?'◌ Cumulative deposits':'◌ Cash reference';
root.querySelector('#ledger').innerHTML=[['Deposits',d.deposits[t]],[d.real?'Market & inflation P&L':'Gross market P&L',pnl[t]+d.fees[t]],['Trading fees',-d.fees[t]],['Net investment P&L',pnl[t]]].map(([n,v])=>'<div><span class="asset">'+n+'</span><span class="amount">'+money(v)+'</span></div>').join('');
root.querySelector('#allocations').innerHTML=d.holdings[t].map((v,i)=>'<div><span class="asset">'+names[i]+'</span><span class="amount">'+money(v)+'</span><div class="rail"><div class="fill" style="background:'+colors[i]+';width:'+(d.values[t]>0?100*v/d.values[t]:0)+'%"></div></div></div>').join('');
root.querySelector('#explain').textContent=d.note+(d.real?' Deposits and fees are discounted at their own dates; dollar P&L includes inflation.':'')+' P&L = balance minus every deposit. The lower curve is the drawdown of unitized returns, including fees. Cash is a benchmark, not a guarantee.';
}
function pause(){playing=false;clearTimeout(timer);button.textContent='Replay journey'}function step(){if(!playing)return;if(t>=d.values.length-1){pause();return}t++;draw();timer=setTimeout(step,delay)}
button.addEventListener('click',()=>{if(playing){pause();return}if(t>=d.values.length-1)t=0;playing=true;button.textContent='Pause';draw();timer=setTimeout(step,delay)});
slider.addEventListener('input',()=>{pause();t=Number(slider.value);draw()});root.querySelector('#reset').addEventListener('click',()=>{pause();t=0;draw()});
root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;root.querySelectorAll('[data-view]').forEach(v=>v.setAttribute('aria-pressed',v===b?'true':'false'));draw()}));
if(reduced){button.disabled=true;button.textContent='Use the timeline'}draw();
})();
</script>

<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:#deebf3;background:transparent}.board{padding:24px;background:#112b3b;border:1px solid #2e4c5b;border-radius:18px}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#94b1c0}.title{font-size:21px;letter-spacing:-.4px;font-weight:650;margin:8px 0}.sub{font-size:11px;line-height:1.6;color:#a3bdcb}.big{text-align:right;white-space:nowrap}.big strong{font-size:28px;font-weight:650;display:block}.big small{font-size:10px;color:#9bb4c3}.modes{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 8px}button{font:inherit;cursor:pointer;border:1px solid #3a5666;border-radius:7px;background:#1d3b4d;color:#d7e8f1;padding:8px 12px}.modes button{font-size:11px}.modes button[aria-pressed=true]{color:#173741;background:#daeeeb;border-color:#daeeeb}button:focus-visible,input:focus-visible{outline:3px solid #edc477;outline-offset:3px}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}.legend button{background:#183646;font-size:10px;display:flex;gap:7px;align-items:center;padding:7px 9px}.legend button[aria-pressed=false]{opacity:.45}.swatch{height:3px;width:13px;display:inline-block}.legend b{font-variant-numeric:tabular-nums;margin-left:3px}.legend button:disabled{cursor:default}.canvas-wrap{position:relative}canvas{width:100%;height:350px;display:block;touch-action:pan-y}.readout{min-height:24px;font-size:11px;color:#b3cbd7;margin:4px 0 8px;line-height:1.6}.readout strong{color:#fff}.controls{display:flex;align-items:center;gap:10px}.controls button{font-size:11px}.controls input{flex:1;accent-color:#6cd6ca;min-width:60px}.date{font-size:11px;color:#b5cbd7;min-width:80px}#reset{background:transparent}.ledger{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid #345060;padding-top:15px;gap:12px}.ledger span,.asset span{font-size:10px;color:#99b4c3}.ledger strong{display:block;font-size:17px;font-weight:600;margin-top:5px}.assets{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:17px}.asset strong{font-size:12px;display:block;margin:3px 0}.rail{height:3px;background:#2b4656;border-radius:2px;overflow:hidden}.rail i{display:block;height:100%}.foot{font-size:10px;color:#99b4c3;line-height:1.65;margin:17px 0 0}.status{color:#f4c47f;font-size:10px;margin:5px 0} @media(max-width:600px){.board{padding:17px 12px}.head{gap:8px}.title{font-size:17px}.big strong{font-size:23px}.ledger,.assets{grid-template-columns:repeat(2,1fr)}canvas{height:320px}.controls{flex-wrap:wrap}.controls input{min-width:45%}.legend button{font-size:9px}}
</style></head><body><section class="board" id="journey">
<div class="head"><div><div class="eyebrow">HISTORICAL REPLAY / SHARED DEPOSITS</div><div class="title" id="title"></div><div class="sub" id="subtitle"></div></div><div class="big"><strong id="value"></strong><small id="value-label">NET INVESTMENT P&amp;L</small></div></div>
<div class="modes" role="group" aria-label="Chart measure"><button data-view="pnl" aria-pressed="true">Investment P&amp;L</button><button data-view="nav" aria-pressed="false">Investment return</button><button data-view="balance" aria-pressed="false">Account balance</button></div>
<div class="legend" id="legend" role="group" aria-label="Compare examples"></div>
<div class="canvas-wrap"><canvas id="plot" role="img" aria-label="Examples compared on the same dates, with investment performance and daily return drawdown"></canvas></div>
<div class="readout" id="readout" aria-live="polite"></div><div class="status" id="status" aria-live="polite"></div>
<div class="controls"><button id="play" type="button">Replay journey</button><button id="reset" type="button">Reset</button><span class="date" id="date"></span><input id="time" type="range" min="0" aria-label="Illustration month"></div>
<div class="ledger" id="ledger"></div><div class="assets" id="allocations" aria-label="Selected example holdings"></div><p class="foot" id="explain"></p>
</section><script>
(()=>{
const d=__DATA__,root=document.getElementById('journey'),canvas=document.getElementById('plot'),ctx=canvas.getContext('2d'),slider=document.getElementById('time'),play=document.getElementById('play');
const palette=['#a9c1d3','#65d4c4','#ecbe73','#8caefe','#d9a0d9','#e38f8b','#a5d29c'],assetColors=['#9eb4c6','#65d4c4','#edc679','#8caefe'],assetNames=['Cash','US stocks','Gold','7–10y Treasury fund'];
const total=d.values.length-1,unit=d.unit||'Month',pnl=d.values.map((v,i)=>v-d.deposits[i]);let end=total,hover=null,view='pnl',playing=false,timer=null,geometry;
const money=v=>(v<-.005?'−':'')+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:Math.abs(v)<100?2:0,maximumFractionDigits:Math.abs(v)<100?2:0}).format(Math.abs(v)<.005?0:Math.abs(v));
const fallback=[{name:d.selected,values:d.values,nav:d.nav,drawdowns:d.drawdowns},{name:'Cash reference',values:d.referenceValues,nav:d.referenceNav,drawdowns:d.referenceNav.map((v,i)=>v===null?null:Math.max(0,1-v/Math.max(1,...d.referenceNav.slice(0,i+1).filter(x=>x!==null))))}];
const series=(d.comparisons?.length?d.comparisons:fallback).map((s,i)=>({...s,color:palette[i%palette.length],on:true}));let active=series.findIndex(s=>s.name===d.selected);if(active<0)active=0;series.forEach((s,i)=>{s.on=i===active||i<(active<4?4:3)});
root.querySelector('#title').textContent=d.selected||'Selected path';root.querySelector('#subtitle').textContent=(d.dates?d.dates[0]+' — '+d.dates[total]+' · ':'')+(series.length>1?'Compare the same market across '+series.length+' allocations.':'Investment performance, separated from saving.');
if(!d.comparisons?.length)root.querySelector('.eyebrow').textContent='ILLUSTRATIVE PATH / NOT THE MEDIAN';
slider.max=total;slider.value=total;slider.setAttribute('aria-label','Illustration '+unit.toLowerCase());
const legend=root.querySelector('#legend');series.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(s.on));b.setAttribute('aria-label',(i===active?'Selected example: ':'Toggle comparison: ')+s.name);b.innerHTML='<i class="swatch" style="background:'+s.color+'"></i><span></span><b></b>';b.querySelector('span').textContent=s.name+(i===active?' · selected':'');if(i===active)b.disabled=true;b.addEventListener('click',()=>{if(!s.on&&series.filter(v=>v.on).length>=4){root.querySelector('#status').textContent='Hide another comparison first. Up to four examples can be shown together.';return}root.querySelector('#status').textContent='';s.on=!s.on;b.setAttribute('aria-pressed',String(s.on));paint()});legend.appendChild(b)});
function values(s){return view==='pnl'?s.values.map((v,i)=>v-d.deposits[i]):view==='nav'?s.nav.map(v=>v===null?null:100*(v-1)):s.values}
function drawLine(a,x,y,color,width,limit=end,dash=[]){ctx.beginPath();let open=false;for(let i=0;i<=limit;i++){if(a[i]===null){open=false;continue}if(open)ctx.lineTo(x(i),y(a[i]));else{ctx.moveTo(x(i),y(a[i]));open=true}}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function paint(){
const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1,w=rect.width,h=rect.height;canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);
const left=w<500?58:69,right=18,top=18,mainBottom=h-125,ddTop=h-84,ddBottom=h-32,pw=w-left-right;
const visible=series.filter(s=>s.on),all=visible.flatMap(s=>values(s)).filter(v=>v!==null);if(view==='balance')all.push(...d.deposits);let low=Math.min(0,...all),high=Math.max(0,...all),range=high-low;if(range<1e-8){range=2;low=-1;high=1}low-=view==='balance'?0:range*.09;high+=range*.1;
const x=i=>left+i/Math.max(1,total)*pw,y=v=>top+(high-v)/(high-low)*(mainBottom-top),fmt=v=>view==='nav'?(Math.abs(v)<.05?0:v).toFixed(1)+'%':money(v);
ctx.font='10px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';for(let k=0;k<4;k++){const v=low+(high-low)*k/3;ctx.strokeStyle='#2c4859';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(left,y(v));ctx.lineTo(w-right,y(v));ctx.stroke();ctx.fillStyle='#96b0c2';ctx.fillText(fmt(v),left-9,y(v))}
ctx.save();ctx.beginPath();ctx.rect(left,top,pw,mainBottom-top);ctx.clip();if(view!=='balance'){ctx.fillStyle='#e98b7820';ctx.fillRect(left,y(0),pw,Math.max(0,mainBottom-y(0)))}drawLine(Array(total+1).fill(0),x,y,'#688393',.8,end,[3,4]);if(view==='balance')drawLine(d.deposits,x,y,'#b9c8d1',1.5,end,[4,5]);
for(let i=0;i<series.length;i++){if(!series[i].on||i===active)continue;drawLine(values(series[i]),x,y,series[i].color,1.5)}drawLine(values(series[active]),x,y,series[active].color,3);ctx.restore();
const maxDD=Math.max(.005,...visible.flatMap(s=>s.drawdowns).filter(v=>v!==null))*1.15,yd=v=>ddTop+v/maxDD*(ddBottom-ddTop);ctx.fillStyle='#9cb4c3';ctx.textAlign='left';ctx.fillText(w<500?'RETURN DRAWDOWN · EXCLUDES DEPOSITS':'DAILY RETURN DRAWDOWN · DEPOSITS EXCLUDED',left,ddTop-15);ctx.strokeStyle='#496071';ctx.beginPath();ctx.moveTo(left,ddTop);ctx.lineTo(w-right,ddTop);ctx.stroke();
const selected=series[active],dd=selected.drawdowns;ctx.beginPath();ctx.moveTo(x(0),ddTop);for(let i=0;i<=end;i++)ctx.lineTo(x(i),yd(dd[i]||0));ctx.lineTo(x(end),ddTop);ctx.closePath();ctx.fillStyle='#e7a08e19';ctx.fill();for(const s of visible)drawLine(s.drawdowns,x,yd,s===selected?'#f0ac95':s.color,s===selected?2:1);
let trough=0;for(let i=1;i<=end;i++)if((dd[i]||0)>(dd[trough]||0))trough=i;if(dd[trough]>0){ctx.fillStyle='#f0ac95';ctx.beginPath();ctx.arc(x(trough),yd(dd[trough]),3,0,7);ctx.fill();ctx.textAlign=trough/total>.65?'right':'left';ctx.fillText('−'+(100*dd[trough]).toFixed(2)+'% max',Math.max(left+4,Math.min(w-right-4,x(trough))),ddBottom+13)}
ctx.textAlign='right';ctx.fillStyle='#9cb4c3';ctx.fillText('0%',left-9,ddTop);ctx.fillText('−'+(100*maxDD).toFixed(1)+'%',left-9,ddBottom);
for(let j=0;j<4;j++){const i=Math.round(total*j/3);ctx.textAlign=j===0?'left':j===3?'right':'center';const label=d.dates?(w<500?d.dates[i].slice(5):d.dates[i]):unit+' '+i;ctx.fillText(label,x(i),h-5)}
const at=hover===null?end:Math.min(end,hover);if(hover!==null){ctx.strokeStyle='#c0d6df77';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x(at),top);ctx.lineTo(x(at),ddBottom);ctx.stroke();ctx.setLineDash([])}
for(const s of visible){const a=values(s);if(a[at]!==null){ctx.beginPath();ctx.arc(x(at),y(a[at]),s===selected?4:2.5,0,7);ctx.fillStyle=s.color;ctx.fill()}}
const current=values(selected)[at];root.querySelector('#value').textContent=current===null?'Not yet funded':fmt(current);root.querySelector('#value-label').textContent=view==='pnl'?'NET INVESTMENT P&L':view==='nav'?'CUMULATIVE RETURN':'ACCOUNT BALANCE';root.querySelector('#date').textContent=d.dates?d.dates[end]:unit+' '+end;slider.value=end;
series.forEach((s,i)=>{const v=values(s)[at];legend.children[i].querySelector('b').textContent=v===null?'N/A':fmt(v)});
root.querySelector('#readout').textContent=(d.dates?d.dates[at]:unit+' '+at)+' · '+d.selected+' · '+(current===null?'not yet funded':fmt(current))+' · '+(dd[at]===null?'return unavailable':'return drawdown −'+(100*dd[at]).toFixed(2)+'%')+(view==='balance'?' · dashed line = cumulative deposits':view==='pnl'?' · shaded below zero = below cumulative deposits':' · shaded below zero = negative cumulative return');
root.querySelector('#ledger').innerHTML=[['Deposits',d.deposits[at]],[d.real?'Market & inflation P&L':'Gross market P&L',pnl[at]+d.fees[at]],['Trading fees',-d.fees[at]],['Net investment P&L',pnl[at]]].map(([n,v])=>'<div><span>'+n+'</span><strong>'+money(v)+'</strong></div>').join('');
root.querySelector('#allocations').innerHTML=d.holdings[at].map((v,i)=>'<div class="asset"><span>'+assetNames[i]+'</span><strong>'+money(v)+'</strong><div class="rail"><i style="background:'+assetColors[i]+';width:'+(d.values[at]>0?100*v/d.values[at]:0)+'%"></i></div></div>').join('');
root.querySelector('#explain').textContent=d.note+' '+(d.real?'Dollars reflect purchasing power; each deposit and fee is discounted on its own date. ':'')+'P&L subtracts every deposit and includes fees. Drawdown uses the unitized return index, not the growing account balance. The selected example stays bold; other examples can be hidden. Values are daily closes, without intraday lows.';geometry={left,pw};
}
function pause(){playing=false;clearTimeout(timer);play.textContent='Replay journey'}function step(){if(!playing)return;if(end>=total){pause();return}end++;paint();timer=setTimeout(step,unit==='Session'?32:180)}
play.addEventListener('click',()=>{if(playing){pause();return}hover=null;if(end===total)end=0;playing=true;play.textContent='Pause';paint();timer=setTimeout(step,unit==='Session'?32:180)});root.querySelector('#reset').addEventListener('click',()=>{pause();hover=null;end=0;paint()});slider.addEventListener('input',()=>{pause();hover=null;end=+slider.value;paint()});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();hover=Math.max(0,Math.min(end,Math.round((e.clientX-r.left-geometry.left)/geometry.pw*total)));paint()});canvas.addEventListener('pointerleave',()=>{hover=null;paint()});
root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;root.querySelectorAll('[data-view]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));paint()}));if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){play.disabled=true;play.textContent='Use the timeline'}window.addEventListener('resize',paint);paint();
// Streamlit 1.57 content sizing cannot shrink below the old iframe viewport.
// Report intrinsic card height after responsive reflow; transmit dimensions only.
const intrinsicRoot=document.getElementById('journey');
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>requestAnimationFrame(()=>{
    window.parent.postMessage({type:'streamlit:iframe:setSize',width:Math.ceil(document.body.getBoundingClientRect().width),height:Math.ceil(intrinsicRoot.getBoundingClientRect().height)},'*');
})).observe(intrinsicRoot);
})();</script></body></html>
